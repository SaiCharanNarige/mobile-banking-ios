name: iOS build and tests
on: [push, pull_request]
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test
        run: >-
          xcodebuild test
          -project MobileBanking.xcodeproj
          -scheme MobileBanking
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
      - name: Test local REST backend
        run: python3 -m unittest discover -s backend -v
